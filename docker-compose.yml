version: '3.8'

services:
  # خادم قاعدة البيانات PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: restaurant_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: whatsapp_restaurant_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # خادم Redis لإدارة طوابير المعالجة السرعة BullMQ
  redis:
    image: redis:7-alpine
    container_name: restaurant_redis
    restart: always
    command: redis-server --save 60 1 --loglevel notice
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # تطبيق AI Agent Backend
  app:
    build: .
    container_name: restaurant_ai_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DB_URL=postgresql://postgres:postgrespassword@postgres:5432/whatsapp_restaurant_db?schema=public&connection_limit=20
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - WHATSAPP_TOKEN=${WHATSAPP_TOKEN}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
      - WEBHOOK_VERIFY_TOKEN=${WEBHOOK_VERIFY_TOKEN}
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data:
